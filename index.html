<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-container">

    <header>
      <h1>Expense & Budget Visualizer</h1>
      <button class="btn-theme" id="themeToggle" aria-label="Toggle dark mode">
        🌙
      </button>
    </header>

    <div class="main-layout">

      <div class="main-left">

        <section class="balance-section">
          <p class="balance-label">TOTAL BALANCE</p>
          <p class="balance-amount" id="totalBalance">$0.00</p>
        </section>

        <section class="form-section">
          <h2>Add Transaction</h2>
          <form id="transactionForm">
            <div class="form-group">
              <label for="itemName">Item Name</label>
              <input type="text" id="itemName" placeholder="e.g. Coffee" required />
            </div>
            <div class="form-group">
              <label for="amount">Amount</label>
              <input type="number" id="amount" placeholder="e.g. 14.99" step="0.01" min="0.01" required />
            </div>
            <div class="form-group">
              <label for="category">Category</label>
              <select id="category" required>
                <option value="" disabled selected>Select category</option>
              </select>
            </div>
            <button type="submit" class="btn-add">Add Transaction</button>
          </form>
        </section>

        <section class="categories-section">
          <h2>Manage Categories</h2>
          <div class="category-add-row">
            <input type="text" id="newCategoryInput" placeholder="New category name…" maxlength="30" />
            <button class="btn-cat-add" id="btnAddCategory">+ Add</button>
          </div>
          <div class="category-tags" id="categoryTags"></div>
        </section>

        <div class="bottom-grid">
          <section class="transactions-section">
            <h2>Transactions</h2>
            <ul id="transactionList" class="transaction-list">
              <li class="empty-state">No transactions yet.</li>
            </ul>
          </section>

          <section class="chart-section">
            <h2>Spending by Category</h2>
            <div class="chart-wrapper">
              <canvas id="spendingChart"></canvas>
            </div>
            <ul id="chartLegend" class="chart-legend"></ul>
          </section>
        </div>

      </div>

      <aside class="main-right">
        <section class="summary-section">
          <h2>Monthly Summary</h2>
          <div class="summary-controls">
            <label for="summaryMonth">Month:</label>
            <select id="summaryMonth"></select>
          </div>
          <div class="summary-stats" id="summaryStats"></div>
          <div id="summaryTableWrap"></div>
        </section>
      </aside>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
